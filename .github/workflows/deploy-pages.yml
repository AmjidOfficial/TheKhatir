name: Deploy GitHub Pages

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # These are browser-public Supabase settings, not service-role secrets.
      # Repository Actions variables can override the defaults.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://vpjslrrfgmvkurohplzq.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_83NjIXVerAvDjpv9baNZiw_KTipIuVo' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify public Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::Set VITE_SUPABASE_URL." && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Set VITE_SUPABASE_PUBLISHABLE_KEY." && exit 1)

      - name: Build application
        run: npm run build

      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
